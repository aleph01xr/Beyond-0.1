services:
  - type: web
    name: beyond-game-sg
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIGRATION_ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beyond-db-sg
          property: connectionString

databases:
  - name: beyond-db-sg
    region: singapore
    plan: free
    databaseName: beyond
    user: beyond_user
